name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inject Error Budget build metadata
        run: |
          mkdir -p public/error-budgets-lucas-v0 public/error-budgets-v2
          META="{\"git_sha\":\"${GITHUB_SHA}\",\"built_at\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\",\"run_id\":\"${GITHUB_RUN_ID}\",\"source\":\"GitHub Actions deployment\"}"
          printf '%s\n' "$META" > public/error-budgets-lucas-v0/build-meta.json
          printf '%s\n' "$META" > public/error-budgets-v2/build-meta.json

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
