name: Publish Error Budgets Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout standalone project
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch Error Budget data branches
        run: git fetch --prune origin '+refs/heads/error-budgets-data/*:refs/remotes/origin/error-budgets-data/*'

      - name: Build commit-backed dataset
        run: node public/error-budgets/scripts/build-dashboard.mjs

      - name: Test publication gate
        run: node public/error-budgets/scripts/test-publication-gate.mjs

      - name: Build sanitized shared publication state
        run: node public/error-budgets/scripts/build-published-state.mjs

      - name: Strictly validate shared publication state
        run: node public/error-budgets/scripts/validate-publication.mjs public/error-budgets/data/published_state.json

      - name: Build sanitized detail publication state
        run: node public/error-budgets/scripts/build-published-detail-state.mjs

      - name: Assemble standalone site at root
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R public/error-budgets/. dist/

      - name: Validate standalone artifact
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/style.css
          test -f dist/data/dashboard.json
          test -f dist/data/published_state.json
          test -f dist/data/published_detail_state.json
          test -f dist/data/program_actions.json
          test -f dist/schema/error-budget-publication.schema.json
          test -f dist/share/index.html
          test -f dist/embed/index.html
          node dist/scripts/validate-publication.mjs dist/data/published_state.json
          node -e "const d=require('./dist/data/published_detail_state.json'); if(d.schema_version!=='error-budgets-detail-publication-1.0'||!Array.isArray(d.operations)||!Array.isArray(d.actions)) process.exit(1)"
          ! grep -R "PRIVATE_SENTINEL_MUST_NEVER_BE_PUBLISHED" dist/data/published_state.json
          ! grep -R "PRIVATE_SENTINEL_MUST_NEVER_BE_PUBLISHED" dist/data/published_detail_state.json
          ! grep -R "source_branch\|source_ref" dist/data/published_detail_state.json
          ! grep -R "dashboard.json" dist/share/
          ! grep -R "dashboard.json" dist/embed/
          ! grep -R "Rydberg Tweezer Ecosystem Map" dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
