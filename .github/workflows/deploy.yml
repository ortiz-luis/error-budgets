name: Publish GitHub Pages (main only)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout published application
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch Error Budget data branches
        run: |
          git fetch --prune origin '+refs/heads/error-budget/*:refs/remotes/origin/error-budget/*'
          git fetch --prune origin '+refs/heads/error-budgets-data/*:refs/remotes/origin/error-budgets-data/*'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build legacy commit-backed Error Budgets V4 dataset
        run: node public/error-budgets-v4/scripts/build-dashboard.mjs

      - name: Build legacy commit-backed Error Budgets V5 dataset
        run: node public/error-budgets-v5/scripts/build-dashboard.mjs

      - name: Build canonical Error Budgets dataset
        run: node public/error-budgets/scripts/build-dashboard.mjs

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
