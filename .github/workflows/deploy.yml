name: Publish GitHub Pages (main only)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout published application
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch Error Budget operation branches
        run: git fetch --prune origin '+refs/heads/error-budget/*:refs/remotes/origin/error-budget/*'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build commit-backed Error Budgets V4 dataset
        run: node public/error-budgets-v4/scripts/build-dashboard.mjs

      - name: Build commit-backed Error Budgets V5 dataset
        run: node public/error-budgets-v5/scripts/build-dashboard.mjs

      - name: Inject Error Budget build metadata
        run: |
          mkdir -p public/error-budgets-lucas-v0 public/error-budgets-v2 public/error-budgets-v4 public/error-budgets-v5
          META="{\"git_sha\":\"$(git rev-parse HEAD)\",\"trigger_sha\":\"${GITHUB_SHA}\",\"built_at\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\",\"run_id\":\"${GITHUB_RUN_ID}\",\"source\":\"GitHub Actions deployment\"}"
          printf '%s\n' "$META" > public/error-budgets-lucas-v0/build-meta.json
          printf '%s\n' "$META" > public/error-budgets-v2/build-meta.json
          printf '%s\n' "$META" > public/error-budgets-v4/build-meta.json
          printf '%s\n' "$META" > public/error-budgets-v5/build-meta.json

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Remove orphaned Pages deployment lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STALE_SHA="c35df4bbb0f7e4d6544b9e762113c38ae582c40b"
          echo "Cancelling stale Pages deployment ${STALE_SHA}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${STALE_SHA}/cancel" >/dev/null 2>&1 || true
          echo "Removing matching generic deployment records"
          IDS=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${STALE_SHA}&per_page=100" --jq '.[].id' 2>/dev/null || true)
          for ID in ${IDS}; do
            echo "Cleaning deployment record ${ID}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${ID}/statuses" -f state=inactive -f description='Clear orphaned Pages deployment lock' >/dev/null 2>&1 || true
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/deployments/${ID}" >/dev/null 2>&1 || true
          done
          echo "Allowing Pages backend to release the lock"
          sleep 10

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
