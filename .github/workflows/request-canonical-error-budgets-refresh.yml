name: Request Canonical Error Budgets Refresh

on:
  push:
    branches:
      - 'error-budgets-data/**'
    paths:
      - 'public/error-budgets/data/operations/**'

permissions:
  actions: write
  contents: read

concurrency:
  group: error-budgets-refresh
  cancel-in-progress: true

jobs:
  request-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Debounce rapid data updates
        run: sleep 15
      - name: Dispatch main Pages publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
