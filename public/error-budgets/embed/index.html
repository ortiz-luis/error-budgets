<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Error Budgets — Live Module</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:transparent}
    *{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:2px}.module{width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}.pad{padding:14px 16px}.muted{color:#667085}.tiny{font-size:11px}.label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#667085}.value{font-size:22px;font-weight:800;line-height:1.1;margin-top:4px}.sub{font-size:11px;color:#667085;margin-top:4px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.status{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800}.ON_TRACK{background:#ecfdf3;color:#027a48}.AT_RISK{background:#fffaeb;color:#b54708}.OFF_TRACK{background:#fef3f2;color:#b42318}.UNKNOWN{background:#f2f4f7;color:#475467}.good{color:#027a48}.bad{color:#b42318}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.kpi{padding:10px 12px;border:1px solid #eef0f2;border-radius:10px;background:#fafbfc}.kpi strong{display:block;font-size:14px;margin-top:3px}.ops{display:grid;gap:8px}.op{display:grid;grid-template-columns:minmax(0,1.5fr) .8fr .7fr;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #eef0f2}.op:last-child{border-bottom:0}.op strong{font-size:12px}.op small{display:block;color:#667085;font-size:10px;margin-top:2px}.fresh{display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:#16a34a;flex:0 0 auto}.dot.error{background:#dc2626}.error{padding:12px 14px;color:#b42318;background:#fff;border:1px solid #fecdca;border-radius:10px;font-size:12px}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.op{grid-template-columns:1fr .8fr}.op .statuscell{grid-column:2;grid-row:1;justify-self:end}.op .gapcell{grid-column:1/-1}.value{font-size:20px}}
  </style>
</head>
<body>
  <main id="root"></main>
  <script>
    const DATA_URL='../data/published_state.json';
    const REFRESH_MS=30000;
    const params=new URLSearchParams(location.search);
    const requestedOperation=params.get('operation');
    const requestedView=params.get('view')||'overview';
    let lastPublication=null;

    const pct=(v,d=2)=>`${Number(v).toFixed(d)}%`;
    const pp=(v,d=2)=>`${Number(v)>=0?'+':''}${Number(v).toFixed(d)} pp`;
    const when=v=>new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'UTC',timeZoneName:'short'}).format(new Date(v));
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const root=document.getElementById('root');

    function renderOperation(o,data){
      root.innerHTML=`<section class="module pad">
        <div class="row"><div><div class="label">${esc(o.short_name)}</div><div class="sub">${esc(o.title)}</div></div><span class="status ${esc(o.status)}">${esc(String(o.status).replaceAll('_',' '))}</span></div>
        <div class="value">${pct(o.fidelity_pct)} ± ${pct(o.fidelity_uncertainty_pp)}</div>
        <div class="grid">
          <div class="kpi"><span class="label">Target</span><strong>${pct(o.target_fidelity_pct)}</strong></div>
          <div class="kpi"><span class="label">Gap</span><strong class="${o.gap_to_target_pp>=0?'good':'bad'}">${pp(o.gap_to_target_pp)}</strong></div>
          <div class="kpi"><span class="label">Live at</span><strong>${esc(o.live_at)}</strong></div>
        </div>
        <div class="sub">Publication ${esc(data.publication_id)} · ${esc(when(data.generated_at))}</div>
      </section>`;
    }

    function renderOverview(data){
      root.innerHTML=`<section class="module"><div class="pad row"><div><div class="label">Error Budgets</div><div class="sub">Live fidelity summary</div></div><div class="tiny muted">${esc(data.publication_id)}</div></div><div class="ops">${data.operations.map(o=>`<div class="op"><div><strong>${esc(o.short_name)}</strong><small>${esc(o.title)}</small></div><div><strong>${pct(o.fidelity_pct)}</strong><small>Fidelity</small></div><div class="statuscell"><span class="status ${esc(o.status)}">${esc(String(o.status).replaceAll('_',' '))}</span></div><div class="gapcell" style="display:none"></div></div>`).join('')}</div></section>`;
    }

    function renderFreshness(data){
      root.innerHTML=`<section class="module pad"><div class="fresh"><i class="dot"></i><div><div class="label">Current publication</div><div><strong>${esc(data.publication_id)}</strong></div><div class="sub">Updated ${esc(when(data.generated_at))}</div></div></div></section>`;
    }

    function render(data){
      if(requestedOperation){
        const op=data.operations.find(o=>o.id===requestedOperation);
        if(!op) throw new Error(`Unknown operation: ${requestedOperation}`);
        renderOperation(op,data);
      }else if(requestedView==='freshness'){
        renderFreshness(data);
      }else{
        renderOverview(data);
      }
      lastPublication=data.publication_id;
    }

    async function load(){
      try{
        const response=await fetch(`${DATA_URL}?t=${Date.now()}`,{cache:'no-store'});
        if(!response.ok) throw new Error(`HTTP ${response.status}`);
        const data=await response.json();
        if(!data||data.schema_version!=='error-budgets-publication-1.0'||!Array.isArray(data.operations)) throw new Error('Invalid publication contract');
        if(data.publication_id!==lastPublication) render(data);
      }catch(error){
        if(!lastPublication) root.innerHTML=`<div class="error">Unable to load live Error Budgets module: ${esc(error.message)}</div>`;
      }
    }

    load();
    setInterval(load,REFRESH_MS);
  </script>
</body>
</html>
