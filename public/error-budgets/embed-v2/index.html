<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Error Budgets — Executive Embeds V2</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#191919;background:transparent;--line:#e8e6e1;--muted:#7a7770;--soft:#faf9f7;--blue:#dcecf7;--blue2:#7fa9c8;--green:#dff0e4;--greenText:#277342;--yellow:#fff1c7;--yellowText:#8a5b00;--red:#fde2df;--redText:#ba3027;--peach:#fae7d8;--purple:#eadff3;--shadow:0 1px 2px rgba(0,0,0,.04)}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:2px}.module{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}.pad{padding:14px 16px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:13px 16px 11px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}.sub{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.35}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.status,.chip{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:800;white-space:nowrap}.ON_TRACK{background:var(--green);color:var(--greenText)}.AT_RISK{background:var(--red);color:var(--redText)}.OFF_TRACK{background:#ffd8d3;color:#8f241c}.UNKNOWN{background:#eceae6;color:#5c5954}.HIGH{background:var(--red);color:var(--redText)}.MEDIUM{background:var(--yellow);color:var(--yellowText)}.LOW{background:#eceae6;color:#5c5954}.IN_PROGRESS{background:var(--blue);color:#245b77}.PLANNED{background:var(--purple);color:#69448d}.DONE{background:var(--green);color:var(--greenText)}.BLOCKED{background:var(--red);color:var(--redText)}.good{color:#278045}.bad{color:#d32f2f}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.kpi{padding:12px 13px;border-radius:9px;min-height:72px}.kpi:nth-child(1){background:#e8f5eb}.kpi:nth-child(2){background:#f2f1ee}.kpi:nth-child(3){background:#fff3cd}.kpi:nth-child(4){background:#e7f1f8}.kpi .label{font-size:10px;font-weight:700}.kpi strong{display:block;font-size:18px;margin-top:5px;line-height:1.08}.footer{font-size:9px;color:var(--muted);margin-top:9px}
.overview{display:grid}.overview-row{display:grid;grid-template-columns:minmax(150px,1.7fr) 1fr .9fr 1fr .8fr;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}.overview-row:first-child{border-top:0}.overview-row strong{font-size:11px}.overview-row small{display:block;font-size:9px;color:var(--muted);margin-top:2px}.metricv{font-size:11px;font-weight:750}.opname{display:flex;align-items:center;gap:8px}.bullet{width:8px;height:8px;border-radius:50%;background:var(--blue2);flex:0 0 auto}.bullet.risk{background:#e9867b}.bullet.good{background:#74b58a}
.rank{padding:8px 14px 12px}.rank-row{display:grid;grid-template-columns:26px minmax(130px,1.4fr) minmax(150px,2.8fr) 78px 74px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #f0efec}.rank-row:first-child{border-top:0}.rank-n{font-size:10px;color:var(--muted)}.rank-name{font-size:10px;font-weight:700}.track{height:10px;background:#f0efec;border-radius:999px;overflow:hidden}.fill{height:100%;background:#e47d74;border-radius:999px}.rank-val{font-size:10px;font-weight:800;text-align:right}.impact{font-size:9px;font-weight:800;padding:3px 7px;border-radius:999px;text-align:center;background:var(--red);color:var(--redText)}
.donut-wrap{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:center;padding:16px}.donut{width:210px;height:210px;border-radius:50%;position:relative;margin:auto}.donut:after{content:"";position:absolute;inset:42px;background:#fff;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line)}.donut-center{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}.donut-center span{font-size:10px;color:var(--muted)}.donut-center strong{font-size:20px;margin-top:3px}.legend{display:grid;gap:7px}.legend-row{display:grid;grid-template-columns:12px minmax(130px,1fr) 70px 50px;gap:8px;align-items:center;font-size:10px}.swatch{width:9px;height:9px;border-radius:50%}.legend-row strong{text-align:right}.legend-row em{text-align:right;font-style:normal;color:var(--muted)}
.actions table{width:100%;border-collapse:collapse;font-size:10px}.actions th,.actions td{padding:9px 10px;border-top:1px solid var(--line);text-align:left}.actions th{border-top:0;color:var(--muted);font-size:9px}.empty{padding:14px 16px;color:var(--muted);font-size:10px;background:var(--soft)}
.history{padding:10px 14px 14px}.chart-box{position:relative;height:230px}.chart-box svg{width:100%;height:100%;overflow:visible}.axis{stroke:#d9d7d2;stroke-width:1}.grid{stroke:#efeeeb;stroke-width:1}.line{fill:none;stroke:#5f8fb5;stroke-width:3}.line-gap{fill:none;stroke:#d8746c;stroke-width:3}.area{fill:rgba(127,169,200,.13)}.dotpt{fill:#5f8fb5;stroke:#fff;stroke-width:2}.dotgap{fill:#d8746c;stroke:#fff;stroke-width:2}.target{stroke:#8c8a84;stroke-width:1.5;stroke-dasharray:5 4}.tick{font-size:9px;fill:#77736d}.chart-note{display:flex;justify-content:space-between;gap:12px;font-size:9px;color:var(--muted);margin-top:4px}.legend-inline{display:flex;gap:14px;flex-wrap:wrap}.legend-inline span:before{content:"";display:inline-block;width:9px;height:3px;border-radius:2px;background:#5f8fb5;margin-right:5px;vertical-align:middle}.legend-inline span.target-line:before{background:#8c8a84}.legend-inline span.gap-line:before{background:#d8746c}
.error{padding:14px;color:#9b2c22;background:#ffe2dd;border-radius:10px;font-size:11px}
@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}.overview-row{grid-template-columns:1.4fr .8fr .8fr}.overview-row .hide-mobile{display:none}.rank-row{grid-template-columns:22px 1fr 1.4fr 62px}.rank-row .impact{display:none}.donut-wrap{grid-template-columns:1fr}.donut{width:190px;height:190px}.legend-row{grid-template-columns:12px 1fr 62px 45px}.chart-box{height:210px}}
</style>
</head>
<body><main id="root"></main>
<script>
const PUB='../data/published_state.json';
const DETAIL='../data/published_detail_state.json';
const params=new URLSearchParams(location.search);const view=params.get('view')||'overview';const opId=params.get('operation')||'2q';const ids=(params.get('ids')||'1q,2q,movement,initialization,readout,addressability').split(',').map(x=>x.trim()).filter(Boolean);const root=document.getElementById('root');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pct=(v,d=2)=>`${Number(v).toFixed(d)}%`;const pp=(v,d=2)=>`${Number(v)>=0?'+':''}${Number(v).toFixed(d)} pp`;const label=v=>esc(String(v??'').replaceAll('_',' '));
const status=o=>`<span class="status ${esc(o.status)}">${label(o.status)}</span>`;const head=(t,s='')=>`<div class="head"><div><div class="eyebrow">${esc(t)}</div>${s?`<div class="sub">${esc(s)}</div>`:''}</div></div>`;
function op(data,id){const o=data.operations.find(x=>x.id===id);if(!o)throw new Error(`Unknown operation: ${id}`);return o}function selected(data){const set=new Set(ids);return data.operations.filter(x=>set.has(x.id))}
function renderOverview(pub){const ops=selected(pub);root.innerHTML=`<section class="module">${head('Live operations overview','Git-backed fidelity, target, gap and status')}<div class="overview">${ops.map(o=>`<div class="overview-row"><div class="opname"><i class="bullet ${o.status==='AT_RISK'?'risk':o.status==='ON_TRACK'?'good':''}"></i><div><strong>${esc(o.short_name)}</strong><small>${esc(o.title)}</small></div></div><div><div class="metricv">${pct(o.fidelity_pct)} ± ${pct(o.fidelity_uncertainty_pp)}</div><small>Fidelity</small></div><div class="hide-mobile"><div class="metricv">${pct(o.target_fidelity_pct)}</div><small>Target</small></div><div><div class="metricv ${o.gap_to_target_pp>=0?'good':'bad'}">${pp(o.gap_to_target_pp)}</div><small>Gap</small></div><div class="hide-mobile">${status(o)}</div></div>`).join('')}</div></section>`}
function severity(g){const a=Math.abs(Math.min(0,g));return a>=5?'HIGH':a>=1?'MEDIUM':'LOW'}
function renderTopGaps(pub){const rows=selected(pub).filter(o=>o.gap_to_target_pp<0).sort((a,b)=>a.gap_to_target_pp-b.gap_to_target_pp).slice(0,5);const max=Math.max(...rows.map(o=>Math.abs(o.gap_to_target_pp)),1);root.innerHTML=`<section class="module">${head('Top gaps','Largest deficits to target')}<div class="rank">${rows.map((o,i)=>`<div class="rank-row"><div class="rank-n">${i+1}</div><div class="rank-name">${esc(o.short_name)}</div><div class="track"><div class="fill" style="width:${100*Math.abs(o.gap_to_target_pp)/max}%"></div></div><div class="rank-val bad">${pp(o.gap_to_target_pp)}</div><div class="impact">${severity(o.gap_to_target_pp)}</div></div>`).join('')}</div></section>`}
function renderKpi(pub){const o=op(pub,opId);root.innerHTML=`<section class="module pad"><div class="row"><div><div class="eyebrow">Current KPI</div><div class="sub">${esc(o.short_name)} · ${esc(o.title)}</div></div>${status(o)}</div><div class="kpis"><div class="kpi"><span class="label">Fidelity</span><strong>${pct(o.fidelity_pct)} ± ${pct(o.fidelity_uncertainty_pp)}</strong></div><div class="kpi"><span class="label">Target</span><strong>${pct(o.target_fidelity_pct)}</strong></div><div class="kpi"><span class="label">Gap</span><strong class="${o.gap_to_target_pp>=0?'good':'bad'}">${pp(o.gap_to_target_pp)}</strong></div><div class="kpi"><span class="label">Data date</span><strong>${esc(o.live_at)}</strong></div></div><div class="footer">Live from sanitized Git publication state</div></section>`}
function renderDonut(detail){const o=op(detail,opId);const c=o.contributors.slice().sort((a,b)=>b.impact_error_pp-a.impact_error_pp);const colors=['#4f83cc','#ef8b39','#5fa66e','#8c64ad','#f1b43c','#9a9a9a','#6ca0b6','#d36f6f'];let start=0;const segs=c.map((x,i)=>{const end=start+x.share_pct;const s=`${colors[i%colors.length]} ${start}% ${end}%`;start=end;return s});root.innerHTML=`<section class="module">${head(`${o.short_name} · Error budget decomposition`,'Infidelity contribution · share and pp')}<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${segs.join(',')})"><div class="donut-center"><span>Total infidelity</span><strong>${Number(o.total_infidelity_pp).toFixed(2)} pp</strong></div></div><div class="legend">${c.map((x,i)=>`<div class="legend-row"><i class="swatch" style="background:${colors[i%colors.length]}"></i><span>${esc(x.name)}</span><strong>${Number(x.impact_error_pp).toFixed(3)} pp</strong><em>${pct(x.share_pct,0)}</em></div>`).join('')}</div></div></section>`}
function renderActions(detail){const o=op(detail,opId);const actions=detail.actions.filter(a=>a.operation_id===o.id);root.innerHTML=`<section class="module actions">${head(`${o.short_name} · Main gaps & actions`,`Current gap ${pp(o.gap_to_target_pp)}`)}${actions.length?`<table><thead><tr><th>Action</th><th>Priority</th><th>Owner</th><th>State</th></tr></thead><tbody>${actions.map(a=>`<tr><td>${esc(a.action)}</td><td><span class="chip ${esc(a.priority)}">${esc(a.priority)}</span></td><td>${esc(a.owner)}</td><td><span class="chip ${esc(a.state)}">${label(a.state)}</span></td></tr>`).join('')}</tbody></table>`:`<div class="empty">No canonical action registered yet for this operation.</div>`}</section>`}
function svgHistory(o,mode){let h=o.history||[];if(!h.length){root.innerHTML=`<section class="module">${head(`${o.short_name} · History`)}<div class="empty">No validated history available.</div></section>`;return}const W=760,H=210,L=48,R=18,T=18,B=34;const vals=h.map(x=>mode==='gap'?x.fidelity_pct-o.target_fidelity_pct:x.fidelity_pct);let min,max;if(mode==='gap'){min=Math.min(...vals,0);max=Math.max(...vals,0)}else{min=Math.min(...vals,o.target_fidelity_pct);max=Math.max(...vals,o.target_fidelity_pct);const pad=Math.max(.2,(max-min)*.15);min-=pad;max+=pad}if(max===min){max+=1;min-=1}const x=i=>L+(W-L-R)*(h.length===1?.5:i/(h.length-1));const y=v=>T+(H-T-B)*(max-v)/(max-min);const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');const ticks=4;const grid=Array.from({length:ticks+1},(_,i)=>{const v=max-(max-min)*i/ticks;return `<line class="grid" x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"/><text class="tick" x="4" y="${y(v)+3}">${mode==='gap'?v.toFixed(1)+' pp':v.toFixed(2)+'%'}</text>`}).join('');const targetY=mode==='gap'?y(0):y(o.target_fidelity_pct);const circles=vals.map((v,i)=>`<circle class="${mode==='gap'?'dotgap':'dotpt'}" cx="${x(i)}" cy="${y(v)}" r="4"/>`).join('');const dates=h.map((d,i)=>`<text class="tick" x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(d.date.slice(5))}</text>`).join('');root.innerHTML=`<section class="module">${head(`${o.short_name} · ${mode==='gap'?'Gap history':'Fidelity history'}`,mode==='gap'?'Validated Git snapshots · gap to target':'Validated Git snapshots · fidelity vs target')}<div class="history"><div class="chart-box"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}<line class="target" x1="${L}" y1="${targetY}" x2="${W-R}" y2="${targetY}"/><polyline class="${mode==='gap'?'line-gap':'line'}" points="${pts}"/>${circles}${dates}</svg></div><div class="chart-note"><div class="legend-inline"><span class="${mode==='gap'?'gap-line':''}">${mode==='gap'?'Gap to target':'Fidelity'}</span><span class="target-line">${mode==='gap'?'Zero gap':'Target'}</span></div><div>${h.length} validated snapshot(s)</div></div></div></section>`}
async function load(){try{const [p,d]=await Promise.all([fetch(`${PUB}?t=${Date.now()}`,{cache:'no-store'}).then(r=>r.json()),fetch(`${DETAIL}?t=${Date.now()}`,{cache:'no-store'}).then(r=>r.json())]);if(view==='overview')renderOverview(p);else if(view==='top-gaps')renderTopGaps(p);else if(view==='kpi')renderKpi(p);else if(view==='decomposition-donut')renderDonut(d);else if(view==='gap-action')renderActions(d);else if(view==='fidelity-history')svgHistory(op(d,opId),'fidelity');else if(view==='gap-history')svgHistory(op(d,opId),'gap');else throw new Error(`Unknown executive view: ${view}`)}catch(e){root.innerHTML=`<div class="error">Unable to load executive Error Budgets embed: ${esc(e.message)}</div>`}}
load();setInterval(load,30000);
</script>
</body></html>
